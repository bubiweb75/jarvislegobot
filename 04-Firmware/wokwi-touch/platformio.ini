; =============================================================================
; JARVIS LEGO BOT — Wokwi Touch Simulation (FASE 11.1)
; Reuses ../jarvis-desk-buddy/src & include with JARVIS_ENABLE_TOUCH=1.
; =============================================================================

[platformio]
src_dir = ../jarvis-desk-buddy/src
include_dir = ../jarvis-desk-buddy/include
default_envs = esp32s3_wokwi_touch

[env:esp32s3_wokwi_touch]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
    olikraus/U8g2@^2.35.30

build_flags =
    -I../jarvis-desk-buddy/include
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DOLED_DRIVER_SSD1306=1
    -DWOKWI_SIM=1
    -DJARVIS_ENABLE_TOUCH=1
    -Wall
    -Wextra
