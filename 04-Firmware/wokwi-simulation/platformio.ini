; =============================================================================
; JARVIS LEGO BOT — Wokwi Hardware Simulation (FASE 10.2-SIM)
; Reuses ../jarvis-desk-buddy sources & headers without code duplication.
; Target: virtual ESP32-S3-DevKitC-1 + board-ssd1306 (0x3C) + GPIO47 button
; =============================================================================

[platformio]
src_dir = ../jarvis-desk-buddy/src
include_dir = ../jarvis-desk-buddy/include
default_envs = esp32s3_wokwi

[env:esp32s3_wokwi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 memory layout matching real hardware
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
    olikraus/U8g2@^2.35.30

build_flags =
    -I../jarvis-desk-buddy/include
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DOLED_DRIVER_SSD1306=1
    -DWOKWI_SIM=1
    -Wall
    -Wextra
