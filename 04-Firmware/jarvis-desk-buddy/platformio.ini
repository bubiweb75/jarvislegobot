; =============================================================================
; JARVIS AI Desk Buddy — PlatformIO Configuration
; Target MCU: Espressif ESP32-S3-DevKitC-1 N16R8 (16 MB Flash, 8 MB Octal PSRAM)
; Display:    Binghe 1.3" I2C 128x64 Monochrome OLED (SH1106 / SSD1106-SSD1306)
; =============================================================================

[platformio]
default_envs = esp32s3_sh1106

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; N16R8 memory configuration (16MB QIO Flash + 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
    olikraus/U8g2@^2.35.30

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra

; -----------------------------------------------------------------------------
; Environment 1 (DEFAULT): SH1106 controller (132x64 RAM, +2 col offset)
; Most 1.3" I2C OLED modules use SH1106 even when listed as "SSD1106".
; -----------------------------------------------------------------------------
[env:esp32s3_sh1106]
build_flags =
    ${env.build_flags}
    -DOLED_DRIVER_SH1106=1

; -----------------------------------------------------------------------------
; Environment 2 (ALTERNATIVE): SSD1306 / SSD1106 (128x64 RAM, 0 col offset)
; Use this if SH1106 shows a 2-pixel horizontal shift or vertical noise bar.
; -----------------------------------------------------------------------------
[env:esp32s3_ssd1306]
build_flags =
    ${env.build_flags}
    -DOLED_DRIVER_SSD1306=1
