<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="500" fill="#0f172a"/>
  <text x="600" y="34" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Test Progressivi 4 e 5 — Audio I2S (MAX98357A + Speaker 36mm e Microfono INMP441)</text>
  <text x="600" y="56" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">NOTA: Richiede sketch di test I2S dedicato / firmware FASE 8.2B (non presente nel firmware attuale)</text>

  <!-- TEST 4 -->
  <rect x="25" y="78" width="565" height="395" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="307" y="106" fill="#fca5a5" font-size="15" font-weight="bold" text-anchor="middle">TEST 4 — MAX98357A + Speaker 36mm (4 Ohm / 3W)</text>

  <rect x="45" y="128" width="135" height="200" rx="6" fill="#172554" stroke="#60a5fa"/>
  <text x="112" y="150" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ESP32-S3</text>
  <text x="168" y="178" fill="#fca5a5" font-size="11" text-anchor="end">5V VBUS</text>
  <text x="168" y="203" fill="#cbd5e1" font-size="11" text-anchor="end">GND</text>
  <text x="168" y="228" fill="#fdba74" font-size="11" text-anchor="end">3V3</text>
  <text x="168" y="258" fill="#86efac" font-size="11" text-anchor="end">GPIO 7</text>
  <text x="168" y="283" fill="#86efac" font-size="11" text-anchor="end">GPIO 15</text>
  <text x="168" y="308" fill="#86efac" font-size="11" text-anchor="end">GPIO 16</text>

  <rect x="245" y="128" width="155" height="200" rx="6" fill="#0f172a" stroke="#4ade80"/>
  <text x="322" y="150" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">MAX98357A</text>
  <text x="255" y="178" fill="#fca5a5" font-size="11">VIN (5V)</text>
  <text x="255" y="203" fill="#cbd5e1" font-size="11">GND</text>
  <text x="255" y="228" fill="#fdba74" font-size="11">SD (En.)</text>
  <text x="255" y="258" fill="#86efac" font-size="11">DIN</text>
  <text x="255" y="283" fill="#86efac" font-size="11">BCLK</text>
  <text x="255" y="308" fill="#86efac" font-size="11">LRC</text>
  <text x="322" y="322" fill="#94a3b8" font-size="10" text-anchor="middle">GAIN: NC (9dB)</text>

  <rect x="440" y="165" width="130" height="120" rx="6" fill="#450a0a" stroke="#f87171"/>
  <text x="505" y="192" fill="#fecaca" font-size="12" font-weight="bold" text-anchor="middle">Speaker 36mm</text>
  <text x="505" y="210" fill="#fca5a5" font-size="11" text-anchor="middle">4 Ohm / 3 W</text>
  <text x="450" y="236" fill="#ffffff" font-size="11">+ (OUT+)</text>
  <text x="450" y="262" fill="#ffffff" font-size="11">- (OUT-)</text>
  <text x="505" y="278" fill="#fde047" font-size="9" text-anchor="middle">MAI a GND!</text>

  <line x1="180" y1="174" x2="245" y2="174" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="180" y1="199" x2="245" y2="199" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="180" y1="224" x2="245" y2="224" stroke="#f97316" stroke-width="2.5"/>
  <line x1="180" y1="254" x2="245" y2="254" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="180" y1="279" x2="245" y2="279" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="180" y1="304" x2="245" y2="304" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="400" y1="232" x2="440" y2="232" stroke="#f87171" stroke-width="2.5"/>
  <line x1="400" y1="258" x2="440" y2="258" stroke="#f87171" stroke-width="2.5"/>

  <text x="45" y="358" fill="#86efac" font-size="12" font-weight="bold">Regole Critiche:</text>
  <text x="45" y="378" fill="#e2e8f0" font-size="11">- VIN su 5V VBUS (MAI su 3V3!). Iniziare test audio al 15-25% volume.</text>
  <text x="45" y="398" fill="#e2e8f0" font-size="11">- Uscita BTL differenziale: controllare col multimetro che OUT+/OUT- non tocchino GND.</text>
  <text x="45" y="418" fill="#fbbf24" font-size="11">- Verificare serigrafia SD e GAIN sul breakout ricevuto.</text>
  <text x="45" y="452" fill="#f87171" font-size="11" font-weight="bold">STOP se: ESP32 si riavvia all'avvio audio, chip scotta o si sente distorsione grave</text>

  <!-- TEST 5 -->
  <rect x="610" y="78" width="565" height="395" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="892" y="106" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle">TEST 5 — Microfono Digitale INMP441 (I2S0 RX)</text>

  <rect x="640" y="128" width="145" height="200" rx="6" fill="#172554" stroke="#60a5fa"/>
  <text x="712" y="150" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ESP32-S3</text>
  <text x="772" y="178" fill="#fdba74" font-size="11" text-anchor="end">3V3</text>
  <text x="772" y="203" fill="#cbd5e1" font-size="11" text-anchor="end">GND</text>
  <text x="772" y="253" fill="#86efac" font-size="11" text-anchor="end">GPIO 4</text>
  <text x="772" y="278" fill="#86efac" font-size="11" text-anchor="end">GPIO 5</text>
  <text x="772" y="303" fill="#86efac" font-size="11" text-anchor="end">GPIO 6</text>

  <rect x="865" y="128" width="275" height="200" rx="6" fill="#0f172a" stroke="#4ade80"/>
  <text x="1002" y="150" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Modulo INMP441</text>
  <text x="880" y="178" fill="#fdba74" font-size="11">VDD (SOLO 3.3V!)</text>
  <text x="880" y="203" fill="#cbd5e1" font-size="11">GND</text>
  <text x="880" y="226" fill="#cbd5e1" font-size="11">L/R -&gt; GND (Canale Left)</text>
  <text x="880" y="253" fill="#86efac" font-size="11">WS  (LRCLK)</text>
  <text x="880" y="278" fill="#86efac" font-size="11">SCK (BCLK)</text>
  <text x="880" y="303" fill="#86efac" font-size="11">SD  (Dati verso ESP32)</text>

  <line x1="785" y1="174" x2="865" y2="174" stroke="#f97316" stroke-width="2.5"/>
  <line x1="785" y1="199" x2="865" y2="199" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="825" y1="199" x2="825" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="825" y1="222" x2="865" y2="222" stroke="#94a3b8" stroke-width="2"/>
  <line x1="785" y1="249" x2="865" y2="249" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="785" y1="274" x2="865" y2="274" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="785" y1="299" x2="865" y2="299" stroke="#4ade80" stroke-width="2.5"/>

  <text x="630" y="358" fill="#86efac" font-size="12" font-weight="bold">Regole Critiche:</text>
  <text x="630" y="378" fill="#e2e8f0" font-size="11">- VDD SOLO a 3.3V (5V distruggono istantaneamente il sensore MEMS).</text>
  <text x="630" y="398" fill="#e2e8f0" font-size="11">- L/R collegato a GND (non lasciare flottante). Verificare lato foro acustico.</text>
  <text x="630" y="418" fill="#e2e8f0" font-size="11">- Test acquisizione 16 kHz mono: verificare assenza clipping/fruscio bianco.</text>
  <text x="630" y="452" fill="#f87171" font-size="11" font-weight="bold">STOP se: VDD su 5V, corto 3V3-GND o chip caldo</text>
</svg>
