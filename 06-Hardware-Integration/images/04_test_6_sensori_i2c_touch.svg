<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="540" fill="#0f172a"/>
  <text x="600" y="34" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Test Progressivo 6 — Sensori Fisici (VL53L0X, TTP223, MPU6050, BH1750)</text>
  <text x="600" y="56" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">STATO: FIRMWARE FUTURO (FASE 8.2B) — Attualmente in pinout_config.h sono presenti solo stub inattivi</text>

  <!-- ESP32 -->
  <rect x="35" y="110" width="235" height="315" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="152" y="138" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">ESP32-S3 DevKitC-1</text>
  <text x="255" y="175" fill="#fdba74" font-size="12" text-anchor="end">3V3</text>
  <text x="255" y="205" fill="#cbd5e1" font-size="12" text-anchor="end">GND</text>
  <text x="255" y="245" fill="#7dd3fc" font-size="12" text-anchor="end">GPIO 41 (SDA)</text>
  <text x="255" y="275" fill="#7dd3fc" font-size="12" text-anchor="end">GPIO 42 (SCL)</text>
  <text x="255" y="325" fill="#e9d5ff" font-size="12" text-anchor="end">GPIO 8 (Touch)</text>
  <text x="255" y="355" fill="#e9d5ff" font-size="12" text-anchor="end">GPIO 9 (XSHUT opz.)</text>
  <text x="255" y="385" fill="#e9d5ff" font-size="12" text-anchor="end">GPIO 10 (INT opz.)</text>

  <!-- Bus rails -->
  <line x1="270" y1="171" x2="350" y2="171" stroke="#f97316" stroke-width="2.5"/>
  <line x1="270" y1="201" x2="335" y2="201" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="270" y1="241" x2="320" y2="241" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="270" y1="271" x2="305" y2="271" stroke="#38bdf8" stroke-width="2.5"/>

  <line x1="350" y1="120" x2="350" y2="470" stroke="#f97316" stroke-width="2"/>
  <line x1="335" y1="120" x2="335" y2="490" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="120" x2="320" y2="365" stroke="#38bdf8" stroke-width="2"/>
  <line x1="305" y1="120" x2="305" y2="380" stroke="#38bdf8" stroke-width="2"/>
  <!-- Derivazioni verso VL53L0X -->
  <line x1="350" y1="125" x2="405" y2="125" stroke="#f97316" stroke-width="1.8"/>
  <line x1="320" y1="138" x2="405" y2="138" stroke="#38bdf8" stroke-width="1.8"/>
  <polyline points="270,351 288,351 288,162 405,162" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="5,3"/>
  <!-- Derivazioni verso MPU6050 -->
  <line x1="350" y1="238" x2="405" y2="238" stroke="#f97316" stroke-width="1.8"/>
  <line x1="320" y1="256" x2="405" y2="256" stroke="#38bdf8" stroke-width="1.8"/>
  <polyline points="270,381 295,381 295,280 405,280" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="5,3"/>
  <!-- Derivazioni verso BH1750 -->
  <line x1="350" y1="356" x2="405" y2="356" stroke="#f97316" stroke-width="1.8"/>
  <line x1="320" y1="365" x2="405" y2="365" stroke="#38bdf8" stroke-width="1.8"/>
  <!-- Derivazioni verso TTP223 -->
  <line x1="350" y1="470" x2="405" y2="470" stroke="#f97316" stroke-width="1.8"/>
  <line x1="335" y1="490" x2="405" y2="490" stroke="#94a3b8" stroke-width="1.8"/>
  <polyline points="270,321 280,321 280,480 405,480" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- 1. VL53L0X -->
  <rect x="405" y="88" width="370" height="102" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="420" y="110" fill="#f8fafc" font-size="13" font-weight="bold">1. VL53L0X — Distanza ToF (0x29)</text>
  <text x="420" y="130" fill="#e2e8f0" font-size="11">VCC &lt;- 3V3 | GND &lt;- GND | SDA &lt;-&gt; GPIO 41 | SCL &lt;- GPIO 42</text>
  <text x="420" y="148" fill="#e9d5ff" font-size="11">XSHUT -&gt; GPIO 9 (SOLO se breakout ha 5/6 pin; 4-pin = non presente)</text>
  <text x="420" y="172" fill="#fbbf24" font-size="10">Test prima da solo, poi insieme a OLED</text>

  <!-- 2. MPU6050 -->
  <rect x="405" y="202" width="370" height="106" rx="6" fill="#1e293b" stroke="#fbbf24"/>
  <text x="420" y="224" fill="#f8fafc" font-size="13" font-weight="bold">2. MPU6050 GY-521 — IMU (0x68)</text>
  <text x="420" y="244" fill="#fbbf24" font-size="11">VCC: 3V3 (VERIFICARE LDO 662K: se dropout eccessivo, controllare 5V + livelli I2C!)</text>
  <text x="420" y="262" fill="#e2e8f0" font-size="11">GND &lt;- GND | AD0 &lt;- GND (0x68) | SDA &lt;-&gt; 41 | SCL &lt;- 42</text>
  <text x="420" y="280" fill="#e9d5ff" font-size="11">INT -&gt; GPIO 10 (opzionale)</text>

  <!-- 3. BH1750 -->
  <rect x="405" y="320" width="370" height="98" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="420" y="342" fill="#f8fafc" font-size="13" font-weight="bold">3. BH1750 GY-302 — Luminosità (0x23)</text>
  <text x="420" y="362" fill="#e2e8f0" font-size="11">VCC &lt;- 3V3 (chip max 3.6V) | GND &lt;- GND | ADDR &lt;- GND (0x23)</text>
  <text x="420" y="380" fill="#e2e8f0" font-size="11">SDA &lt;-&gt; GPIO 41 | SCL &lt;- GPIO 42</text>
  <text x="420" y="402" fill="#fbbf24" font-size="10">Verificare pull-up totali I2C (target 2.2k..4.7k Ohm)</text>

  <!-- 4. TTP223 -->
  <rect x="405" y="430" width="370" height="90" rx="6" fill="#1e293b" stroke="#c084fc"/>
  <text x="420" y="452" fill="#f8fafc" font-size="13" font-weight="bold">4. TTP223 — Tocco Capacitivo (Digitale)</text>
  <text x="420" y="472" fill="#fdba74" font-size="11">VCC &lt;- 3V3 (OBBLIGATORIO: a 5V uscita SIG danneggia GPIO 8!)</text>
  <text x="420" y="492" fill="#e9d5ff" font-size="11">GND &lt;- GND | I/O (SIG) -&gt; GPIO 8</text>

  <!-- Box Avvisi Pull-up & Collaudo -->
  <rect x="805" y="88" width="370" height="432" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="990" y="116" fill="#fca5a5" font-size="14" font-weight="bold" text-anchor="middle">VERIFICHE OBBLIGATORIE PRIMA DEL TEST 6</text>
  <text x="822" y="148" fill="#e2e8f0" font-size="11">1. Collegare UNO alla volta + I2CScanner:</text>
  <text x="832" y="168" fill="#7dd3fc" font-size="11">OLED 0x3C | VL53L0X 0x29 | MPU 0x68 | BH 0x23</text>
  <text x="822" y="198" fill="#e2e8f0" font-size="11">2. Controllo Pull-up I2C in parallelo:</text>
  <text x="832" y="218" fill="#fbbf24" font-size="11">Misurare a freddo R tra SDA-3V3 e SCL-3V3.</text>
  <text x="832" y="236" fill="#fbbf24" font-size="11">Se R &lt; 1.8 kOhm con tutti i moduli collegati,</text>
  <text x="832" y="254" fill="#fbbf24" font-size="11">rimuovere i pull-up su 1-2 breakout.</text>
  <text x="822" y="284" fill="#e2e8f0" font-size="11">3. Verifica GY-521 (MPU6050):</text>
  <text x="832" y="304" fill="#fbbf24" font-size="11">Controllare sigla LDO onboard e tensione</text>
  <text x="832" y="322" fill="#fbbf24" font-size="11">effettiva su SDA/SCL (&lt;= 3.3V).</text>
  <text x="822" y="352" fill="#e2e8f0" font-size="11">4. Prova TTP223 su mattoncino ABS LEGO:</text>
  <text x="832" y="372" fill="#e2e8f0" font-size="11">Verificare sensibilità prima di chiudere il tetto.</text>
  <text x="822" y="410" fill="#f87171" font-size="12" font-weight="bold">PROVVISORIO / NON ALIMENTARE SE:</text>
  <text x="832" y="432" fill="#fecaca" font-size="11">- Qualsiasi linea verso GPIO supera 3.3V</text>
  <text x="832" y="452" fill="#fecaca" font-size="11">- Modulo ha pinout diverso dalla serigrafia attesa</text>
  <text x="832" y="472" fill="#fecaca" font-size="11">- Conflitto indirizzi I2C nello scan</text>
</svg>
