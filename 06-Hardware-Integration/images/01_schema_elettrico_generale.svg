<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="820" fill="#0f172a"/>
  <text x="640" y="36" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle">JARVIS LEGO BOT — Schema Elettrico Generale (FASE 8.2B-0)</text>
  <text x="640" y="58" fill="#94a3b8" font-size="13" text-anchor="middle">ESP32-S3 DevKitC-1 N16R8 | Alimentazioni 5V / 3.3V, Masse Comuni, I2C0, I2S0/I2S1, Pulsante e Sensori Riservati</text>

  <!-- Legenda -->
  <rect x="30" y="72" width="1220" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
  <line x1="50" y1="91" x2="80" y2="91" stroke="#ef4444" stroke-width="3"/><text x="88" y="95" fill="#fca5a5" font-size="12">5V VBUS (Solo MAX98357A VIN)</text>
  <line x1="275" y1="91" x2="305" y2="91" stroke="#f97316" stroke-width="3"/><text x="313" y="95" fill="#fdba74" font-size="12">3.3V Regolata (Logica/Sensori)</text>
  <line x1="500" y1="91" x2="530" y2="91" stroke="#94a3b8" stroke-width="3"/><text x="538" y="95" fill="#cbd5e1" font-size="12">GND Comune</text>
  <line x1="635" y1="91" x2="665" y2="91" stroke="#38bdf8" stroke-width="3"/><text x="673" y="95" fill="#7dd3fc" font-size="12">I2C0 (SDA=41, SCL=42)</text>
  <line x1="835" y1="91" x2="865" y2="91" stroke="#4ade80" stroke-width="3"/><text x="873" y="95" fill="#86efac" font-size="12">I2S Audio (Mic/Ampli)</text>
  <line x1="1030" y1="91" x2="1060" y2="91" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,3"/><text x="1068" y="95" fill="#e9d5ff" font-size="12">GPIO Sensori (FASE 8.2B)</text>

  <!-- PC Windows 11 -->
  <rect x="470" y="128" width="340" height="58" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="640" y="152" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">PC Windows 11 (USB-C Dati + 5V)</text>
  <text x="640" y="172" fill="#94a3b8" font-size="12" text-anchor="middle">Ollama qwen2.5:3b | faster-whisper | Piper Riccardo</text>
  <line x1="640" y1="186" x2="640" y2="224" stroke="#38bdf8" stroke-width="3"/>
  <text x="650" y="210" fill="#7dd3fc" font-size="11">Porta USB Nativa (GPIO 19/20)</text>

  <!-- ESP32-S3 DevKitC-1 N16R8 -->
  <rect x="440" y="224" width="400" height="310" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="640" y="250" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">ESP32-S3 DevKitC-1 (WROOM-1-N16R8)</text>
  <text x="640" y="268" fill="#93c5fd" font-size="11" text-anchor="middle">16MB Flash QIO | 8MB Octal PSRAM | Logica 3.3V (MAI 5V sui GPIO)</text>

  <!-- Pin lato sinistro ESP32 -->
  <text x="455" y="302" fill="#fdba74" font-size="12" font-weight="bold">3V3 OUT (max ~500mA)</text>
  <text x="455" y="328" fill="#fca5a5" font-size="12" font-weight="bold">5V VBUS (da USB)</text>
  <text x="455" y="354" fill="#cbd5e1" font-size="12" font-weight="bold">GND (Comune)</text>
  <text x="455" y="390" fill="#7dd3fc" font-size="12">GPIO 41 — I2C0 SDA</text>
  <text x="455" y="414" fill="#7dd3fc" font-size="12">GPIO 42 — I2C0 SCL</text>
  <text x="455" y="446" fill="#fde047" font-size="12">GPIO 47 — Pulsante (NO)</text>
  <text x="455" y="478" fill="#e9d5ff" font-size="12">GPIO 8  — TTP223 SIG (Fut.)</text>
  <text x="455" y="502" fill="#e9d5ff" font-size="12">GPIO 9  — VL53 XSHUT (Opz.)</text>
  <text x="455" y="522" fill="#e9d5ff" font-size="12">GPIO 10 — MPU INT (Opz.)</text>

  <!-- Pin lato destro ESP32 -->
  <text x="825" y="302" fill="#86efac" font-size="12" text-anchor="end">GPIO 4 — I2S0 RX WS</text>
  <text x="825" y="326" fill="#86efac" font-size="12" text-anchor="end">GPIO 5 — I2S0 RX SCK</text>
  <text x="825" y="350" fill="#86efac" font-size="12" text-anchor="end">GPIO 6 — I2S0 RX SD</text>
  <text x="825" y="394" fill="#86efac" font-size="12" text-anchor="end">GPIO 7  — I2S1 TX DIN</text>
  <text x="825" y="418" fill="#86efac" font-size="12" text-anchor="end">GPIO 15 — I2S1 TX BCLK</text>
  <text x="825" y="442" fill="#86efac" font-size="12" text-anchor="end">GPIO 16 — I2S1 TX LRC</text>

  <rect x="655" y="462" width="170" height="58" rx="5" fill="#1e1b4b" stroke="#f87171"/>
  <text x="740" y="479" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">PIN VIETATI / RISERVATI</text>
  <text x="740" y="495" fill="#fecaca" font-size="10" text-anchor="middle">35-37 (PSRAM), 0,3,45,46 (Strap)</text>
  <text x="740" y="510" fill="#fecaca" font-size="10" text-anchor="middle">19-20 (USB), 43-44 (UART), 38/48</text>

  <!-- OLED 1.3" -->
  <rect x="35" y="230" width="290" height="105" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="253" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">OLED 1,3" 128x64 I2C (SH1106)</text>
  <text x="180" y="271" fill="#7dd3fc" font-size="11" text-anchor="middle">Indirizzo: 0x3C (o 0x3D) | Verificare pin VCC/GND</text>
  <text x="50" y="294" fill="#fdba74" font-size="11">VCC &lt;- 3.3V</text>
  <text x="50" y="312" fill="#cbd5e1" font-size="11">GND &lt;- GND</text>
  <text x="190" y="294" fill="#7dd3fc" font-size="11">SDA &lt;-&gt; GPIO 41</text>
  <text x="190" y="312" fill="#7dd3fc" font-size="11">SCL &lt;- GPIO 42</text>

  <!-- Linee I2C da ESP32 a OLED e Bus verso Sensori -->
  <line x1="440" y1="386" x2="385" y2="386" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="440" y1="410" x2="368" y2="410" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="385" y1="290" x2="385" y2="546" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="368" y1="308" x2="368" y2="555" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="385" y1="290" x2="325" y2="290" stroke="#38bdf8" stroke-width="2"/>
  <line x1="368" y1="308" x2="325" y2="308" stroke="#38bdf8" stroke-width="2"/>
  <!-- Bus orizzontale I2C0 sopra i sensori + derivazioni -->
  <line x1="135" y1="546" x2="515" y2="546" stroke="#38bdf8" stroke-width="2"/>
  <line x1="135" y1="555" x2="515" y2="555" stroke="#38bdf8" stroke-width="2"/>
  <line x1="135" y1="546" x2="135" y2="605" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="325" y1="546" x2="325" y2="605" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="515" y1="546" x2="515" y2="605" stroke="#38bdf8" stroke-width="1.8"/>
  <!-- Linee GPIO 8, 9, 10 verso sensori -->
  <polyline points="440,474 415,474 415,536 697,536 697,605" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polyline points="440,498 403,498 403,526 155,526 155,605" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polyline points="440,518 395,518 395,580 345,580 345,605" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Pulsante -->
  <rect x="35" y="355" width="290" height="70" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="180" y="378" fill="#fef08a" font-size="14" font-weight="bold" text-anchor="middle">Pulsante Momentaneo NO</text>
  <text x="180" y="398" fill="#cbd5e1" font-size="11" text-anchor="middle">Pin A &lt;- GPIO 47 (INPUT_PULLUP) | Pin B &lt;- GND</text>
  <text x="180" y="414" fill="#94a3b8" font-size="10" text-anchor="middle">Breve: cambia espressione | Lunga >=1.5s: Auto Demo</text>
  <line x1="440" y1="442" x2="325" y2="442" stroke="#facc15" stroke-width="2"/>
  <line x1="325" y1="442" x2="325" y2="395" stroke="#facc15" stroke-width="2"/>

  <!-- Sensori FASE 8.2B (in basso a sinistra e centro) -->
  <rect x="35" y="565" width="760" height="195" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="415" y="588" fill="#e9d5ff" font-size="14" font-weight="bold" text-anchor="middle">SENSORI FISICI FASE 8.2B (Firmware Futuro — Bus I2C0 Condiviso GPIO 41/42 + GPIO 8/9/10)</text>

  <!-- VL53L0X -->
  <rect x="50" y="605" width="170" height="138" rx="6" fill="#0f172a" stroke="#a855f7"/>
  <text x="135" y="625" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">VL53L0X (ToF)</text>
  <text x="135" y="642" fill="#7dd3fc" font-size="11" text-anchor="middle">I2C: 0x29</text>
  <text x="60" y="664" fill="#fdba74" font-size="11">VCC: 3.3V | GND: GND</text>
  <text x="60" y="682" fill="#7dd3fc" font-size="11">SDA: 41 | SCL: 42</text>
  <text x="60" y="700" fill="#e9d5ff" font-size="11">XSHUT: GPIO 9 (opz.)</text>
  <text x="60" y="725" fill="#fbbf24" font-size="10">Alcuni moduli hanno 4 pin</text>

  <!-- MPU6050 -->
  <rect x="235" y="605" width="180" height="138" rx="6" fill="#0f172a" stroke="#a855f7"/>
  <text x="325" y="625" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">MPU6050 (GY-521)</text>
  <text x="325" y="642" fill="#7dd3fc" font-size="11" text-anchor="middle">I2C: 0x68 (AD0-&gt;GND)</text>
  <text x="245" y="664" fill="#fbbf24" font-size="11">VCC: 3.3V (verif. LDO!)</text>
  <text x="245" y="682" fill="#7dd3fc" font-size="11">SDA: 41 | SCL: 42</text>
  <text x="245" y="700" fill="#e9d5ff" font-size="11">INT: GPIO 10 (opz.)</text>
  <text x="245" y="725" fill="#fbbf24" font-size="10">Controllare dropout LDO</text>

  <!-- BH1750 -->
  <rect x="430" y="605" width="170" height="138" rx="6" fill="#0f172a" stroke="#a855f7"/>
  <text x="515" y="625" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">BH1750 (GY-302)</text>
  <text x="515" y="642" fill="#7dd3fc" font-size="11" text-anchor="middle">I2C: 0x23 (ADDR-&gt;GND)</text>
  <text x="440" y="664" fill="#fdba74" font-size="11">VCC: 3.3V (chip max 3.6V)</text>
  <text x="440" y="682" fill="#7dd3fc" font-size="11">SDA: 41 | SCL: 42</text>
  <text x="440" y="700" fill="#cbd5e1" font-size="11">ADDR: GND</text>
  <text x="440" y="725" fill="#fbbf24" font-size="10">Verif. pull-up I2C in //</text>

  <!-- TTP223 -->
  <rect x="615" y="605" width="165" height="138" rx="6" fill="#0f172a" stroke="#a855f7"/>
  <text x="697" y="625" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">TTP223 (Touch)</text>
  <text x="697" y="642" fill="#e9d5ff" font-size="11" text-anchor="middle">Digitale 3.3V</text>
  <text x="625" y="664" fill="#fdba74" font-size="11">VCC: 3.3V (OBBLIGAT.)</text>
  <text x="625" y="682" fill="#cbd5e1" font-size="11">GND: GND</text>
  <text x="625" y="700" fill="#e9d5ff" font-size="11">I/O (SIG): GPIO 8</text>
  <text x="625" y="725" fill="#fbbf24" font-size="10">Test attraverso ABS LEGO</text>

  <!-- INMP441 -->
  <rect x="930" y="230" width="315" height="145" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="1087" y="253" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Microfono INMP441 (I2S0 RX)</text>
  <text x="1087" y="271" fill="#86efac" font-size="11" text-anchor="middle">Logica &amp; Alimentazione SOLO 3.3V (MAI 5V!)</text>
  <text x="945" y="295" fill="#fdba74" font-size="11">VDD &lt;- 3.3V</text>
  <text x="945" y="313" fill="#cbd5e1" font-size="11">GND &lt;- GND | L/R &lt;- GND (Canale Left)</text>
  <text x="945" y="335" fill="#86efac" font-size="11">WS  &lt;- GPIO 4 | SCK &lt;- GPIO 5 | SD -&gt; GPIO 6</text>
  <text x="945" y="357" fill="#94a3b8" font-size="10">Firmware I2S audio in FASE 8.2B / Bridge USB</text>

  <line x1="840" y1="298" x2="930" y2="298" stroke="#4ade80" stroke-width="2"/>
  <line x1="840" y1="322" x2="930" y2="322" stroke="#4ade80" stroke-width="2"/>
  <line x1="840" y1="346" x2="930" y2="346" stroke="#4ade80" stroke-width="2"/>

  <!-- MAX98357A -->
  <rect x="930" y="395" width="315" height="175" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="1087" y="418" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Amplificatore MAX98357A (I2S1 TX)</text>
  <text x="1087" y="436" fill="#fca5a5" font-size="11" text-anchor="middle">VIN &lt;- 5V VBUS (MAI da 3V3) | Logica 3.3V</text>
  <text x="945" y="460" fill="#fca5a5" font-size="11">VIN &lt;- 5V | GND &lt;- GND</text>
  <text x="945" y="478" fill="#fdba74" font-size="11">SD &lt;- 3.3V (verif. breakout) | GAIN: NC (9dB)</text>
  <text x="945" y="498" fill="#86efac" font-size="11">DIN &lt;- GPIO 7 | BCLK &lt;- GPIO 15 | LRC &lt;- GPIO 16</text>
  <text x="945" y="520" fill="#f87171" font-size="11" font-weight="bold">OUT+ / OUT- -&gt; SOLO Speaker (MAI a GND!)</text>
  <text x="945" y="542" fill="#94a3b8" font-size="10">Uscita differenziale Classe-D (BTL)</text>

  <line x1="840" y1="390" x2="930" y2="390" stroke="#4ade80" stroke-width="2"/>
  <line x1="840" y1="414" x2="930" y2="414" stroke="#4ade80" stroke-width="2"/>
  <line x1="840" y1="438" x2="930" y2="438" stroke="#4ade80" stroke-width="2"/>

  <!-- Speaker -->
  <rect x="965" y="610" width="245" height="90" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <text x="1087" y="635" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">Speaker 36mm, 4 Ohm, 3W</text>
  <text x="1087" y="657" fill="#fca5a5" font-size="12" text-anchor="middle">OUT+ (+)  &amp;  OUT- (-)</text>
  <text x="1087" y="678" fill="#94a3b8" font-size="11" text-anchor="middle">Collegamento diretto solo a MAX98357A</text>
  <line x1="1040" y1="570" x2="1040" y2="610" stroke="#f87171" stroke-width="2.5"/>
  <line x1="1135" y1="570" x2="1135" y2="610" stroke="#f87171" stroke-width="2.5"/>

  <!-- Footer avviso -->
  <rect x="35" y="772" width="1210" height="32" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="640" y="793" fill="#fecaca" font-size="12" font-weight="bold" text-anchor="middle">REGOLA DI SICUREZZA: Eseguire tutti i cablaggi a USB scollegata. Non collegare mai 5V ai GPIO o al pin 3V3. Verificare ogni serigrafia all'arrivo dei moduli.</text>
</svg>
