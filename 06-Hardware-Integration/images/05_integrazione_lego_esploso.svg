<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="620" fill="#0f172a"/>
  <text x="600" y="34" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Integrazione Meccanica Indicativa — Companion Hybrid v2 (Visiera Capsula Arrotondata SNOT)</text>
  <text x="600" y="56" fill="#fbbf24" font-size="12" text-anchor="middle">Sezione laterale concettuale (10x10 stud = 80x80 mm esterni, cavità 64x64 mm) — DA VALIDARE COL CALIBRO ALL'ARRIVO COMPONENTI</text>

  <!-- Corpo LEGO 10x10 stud (sezione laterale: Fronte a SX, Retro a DX) -->
  <rect x="260" y="105" width="460" height="410" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <!-- Cavità interna -->
  <rect x="305" y="150" width="370" height="335" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Etichette orientamento -->
  <text x="260" y="92" fill="#7dd3fc" font-size="13" font-weight="bold">FRONTE (Z = 0 mm)</text>
  <text x="720" y="92" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="end">RETRO (Portello 3036: 48 x 57.6 mm)</text>

  <!-- Visiera frontale e OLED -->
  <rect x="248" y="210" width="18" height="90" rx="6" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
  <rect x="312" y="195" width="18" height="120" rx="3" fill="#0284c7" stroke="#7dd3fc" stroke-width="2"/>
  <text x="321" y="260" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 321 260)">OLED 1.3" (Z=12mm)</text>
  <!-- Pad EPDM/EVA -->
  <rect x="330" y="215" width="10" height="80" fill="#f59e0b" fill-opacity="0.6"/>

  <!-- Speaker 36mm sotto griglia tetto L9-L10 -->
  <rect x="395" y="105" width="190" height="18" rx="4" fill="#475569"/>
  <text x="490" y="118" fill="#e2e8f0" font-size="10" text-anchor="middle">Griglia Tetto L9-L10 (4162)</text>
  <rect x="405" y="152" width="170" height="58" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text x="490" y="178" fill="#fecaca" font-size="12" font-weight="bold" text-anchor="middle">Speaker 36mm (4 Ohm/3W)</text>
  <text x="490" y="196" fill="#fca5a5" font-size="10" text-anchor="middle">Verificare altezza magnete</text>

  <!-- TTP223 sotto tetto anteriore -->
  <rect x="315" y="152" width="65" height="22" rx="3" fill="#581c87" stroke="#c084fc"/>
  <text x="347" y="167" fill="#f3e8ff" font-size="10" text-anchor="middle">TTP223</text>

  <!-- BH1750 dietro tile Trans-Clear -->
  <rect x="260" y="140" width="45" height="26" rx="3" fill="#0369a1" stroke="#38bdf8"/>
  <text x="282" y="157" fill="#e0f2fe" font-size="9" text-anchor="middle">BH1750</text>

  <!-- VL53L0X sotto soglia visiera L1 -->
  <rect x="262" y="340" width="43" height="28" rx="3" fill="#0369a1" stroke="#38bdf8"/>
  <text x="283" y="358" fill="#e0f2fe" font-size="9" text-anchor="middle">VL53L0X</text>

  <!-- INMP441 foro L8 destro (indicato in sezione) -->
  <rect x="465" y="225" width="55" height="28" rx="3" fill="#14532d" stroke="#4ade80"/>
  <text x="492" y="243" fill="#dcfce7" font-size="9" text-anchor="middle">INMP441</text>

  <!-- MAX98357A -->
  <rect x="440" y="275" width="90" height="36" rx="4" fill="#14532d" stroke="#4ade80"/>
  <text x="485" y="297" fill="#dcfce7" font-size="10" text-anchor="middle">MAX98357A</text>

  <!-- MPU6050 smorzato in basso -->
  <rect x="365" y="452" width="85" height="24" rx="3" fill="#78350f" stroke="#fbbf24"/>
  <text x="407" y="468" fill="#fef3c7" font-size="10" text-anchor="middle">MPU6050 + EVA</text>

  <!-- ESP32-S3 su guida 32316 a Z=54mm -->
  <rect x="575" y="210" width="32" height="230" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="591" y="325" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 591 325)">ESP32-S3 su guida 32316 (Z=54mm)</text>

  <!-- Portello posteriore 3036 + USB L0 -->
  <rect x="675" y="190" width="45" height="220" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="697" y="300" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 697 300)">Portello 3036 Removibile</text>
  <rect x="675" y="455" width="60" height="26" rx="4" fill="#0284c7" stroke="#38bdf8"/>
  <text x="705" y="472" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">USB L0</text>

  <!-- Base B1 -->
  <rect x="220" y="515" width="540" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="490" y="540" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Base Fissa B1 (12x12 stud = 96x96 mm) / Futura Base Mobile B2</text>

  <!-- Callout SX -->
  <rect x="25" y="120" width="215" height="430" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="40" y="148" fill="#7dd3fc" font-size="13" font-weight="bold">Zona Frontale &amp; Tetto</text>
  <text x="40" y="174" fill="#e2e8f0" font-size="11">- Visiera capsula: 32 x 16 mm</text>
  <text x="40" y="194" fill="#e2e8f0" font-size="11">- OLED dietro visiera (Z=12 mm)</text>
  <text x="40" y="214" fill="#fbbf24" font-size="11">  Fissaggio EVA provvisorio</text>
  <text x="40" y="244" fill="#e2e8f0" font-size="11">- BH1750: dietro tile Trans-Clear</text>
  <text x="40" y="274" fill="#e2e8f0" font-size="11">- VL53L0X: finestra L1 sotto</text>
  <text x="40" y="292" fill="#e2e8f0" font-size="11">  soglia (modifica reversibile)</text>
  <text x="40" y="322" fill="#e2e8f0" font-size="11">- TTP223: sotto tile tetto</text>
  <text x="40" y="340" fill="#e2e8f0" font-size="11">  (lontano da magnete speaker)</text>
  <text x="40" y="370" fill="#e2e8f0" font-size="11">- Pulsante meccanico: lato SX L3</text>
  <text x="40" y="400" fill="#e2e8f0" font-size="11">- INMP441: lato DX L8 (foro 3700)</text>
  <text x="40" y="430" fill="#e2e8f0" font-size="11">- MPU6050: base interna L0/L1</text>
  <text x="40" y="448" fill="#e2e8f0" font-size="11">  con pad anti-vibrazione</text>

  <!-- Callout DX -->
  <rect x="755" y="120" width="420" height="430" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="772" y="148" fill="#fbbf24" font-size="13" font-weight="bold">Verifiche Meccaniche Obbligatorie</text>
  <text x="772" y="178" fill="#e2e8f0" font-size="11">1. Cavità interna 8x8 stud = 64 x 64 mm (altezza ~86 mm):</text>
  <text x="782" y="198" fill="#86efac" font-size="11">Speaker 36mm entra in pianta, ma verificare profondità magnete</text>
  <text x="782" y="216" fill="#86efac" font-size="11">rispetto a MAX98357A e cavi sotto il tetto L9-L10.</text>
  <text x="772" y="248" fill="#e2e8f0" font-size="11">2. Spazio intorno a ESP32-S3 (Z=54 mm):</text>
  <text x="782" y="268" fill="#fbbf24" font-size="11">I pin Dupont dritti sporgono ~12-15 mm per lato: valutare</text>
  <text x="782" y="286" fill="#fbbf24" font-size="11">header ad angolo o cavi saldati 28 AWG con guaina.</text>
  <text x="772" y="318" fill="#e2e8f0" font-size="11">3. Passaggio USB L0 e ventilazione:</text>
  <text x="782" y="338" fill="#e2e8f0" font-size="11">Allineare la porta "USB" nativa al varco posteriore L0.</text>
  <text x="782" y="356" fill="#e2e8f0" font-size="11">Garantire ricambio d'aria tramite fori griglia L9-L10.</text>
  <text x="772" y="388" fill="#e2e8f0" font-size="11">4. Isolamento elettrico:</text>
  <text x="782" y="408" fill="#e2e8f0" font-size="11">Nastro Kapton o guaina sotto ogni PCB vicino a viti/magnete.</text>
  <text x="772" y="446" fill="#f87171" font-size="12" font-weight="bold">STATO PROGETTO LEGO:</text>
  <text x="772" y="466" fill="#fecaca" font-size="11">Non fisicamente validato finché non vengono misurate con</text>
  <text x="772" y="484" fill="#fecaca" font-size="11">calibro le dimensioni reali di tutte le schede consegnate.</text>
</svg>
