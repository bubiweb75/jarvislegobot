<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="520" fill="#0f172a"/>
  <text x="600" y="34" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">Test Progressivi 1, 2 e 3 — ESP32-S3, Display OLED 1,3" e Pulsante GPIO 47</text>
  <text x="600" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">Firmware già compilabile e pronto in 04-Firmware/jarvis-desk-buddy (14 espressioni + PING/STATUS/DIAG/STATE/LOOK)</text>

  <!-- TEST 1 -->
  <rect x="25" y="80" width="365" height="410" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="207" y="108" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">TEST 1 — ESP32-S3 da sola</text>
  <rect x="85" y="130" width="245" height="50" rx="6" fill="#0f172a" stroke="#60a5fa"/>
  <text x="207" y="152" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">PC Windows 11 (Porta USB)</text>
  <text x="207" y="169" fill="#94a3b8" font-size="11" text-anchor="middle">Cavo USB-C Dati (NO solo ricarica)</text>
  <line x1="207" y1="180" x2="207" y2="215" stroke="#38bdf8" stroke-width="3"/>
  <rect x="70" y="215" width="275" height="110" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="207" y="242" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">ESP32-S3 DevKitC-1 N16R8</text>
  <text x="207" y="264" fill="#7dd3fc" font-size="11" text-anchor="middle">Connettere sulla porta marcata "USB"</text>
  <text x="207" y="284" fill="#cbd5e1" font-size="11" text-anchor="middle">(non "UART" per USB-CDC nativo)</text>
  <text x="207" y="308" fill="#fde047" font-size="11" text-anchor="middle">Verificare COM in Gestione Dispositivi</text>
  <text x="45" y="355" fill="#86efac" font-size="12" font-weight="bold">Controlli:</text>
  <text x="45" y="376" fill="#e2e8f0" font-size="11">1. Nessun calore anomalo / odore</text>
  <text x="45" y="396" fill="#e2e8f0" font-size="11">2. LED Power acceso, ~3.3V su pin 3V3</text>
  <text x="45" y="416" fill="#e2e8f0" font-size="11">3. Porta COM visibile su Windows</text>
  <text x="45" y="436" fill="#e2e8f0" font-size="11">4. Pronto per upload PlatformIO</text>
  <text x="45" y="468" fill="#f87171" font-size="11" font-weight="bold">STOP se: PC segnala sovracorrente USB</text>

  <!-- TEST 2 -->
  <rect x="415" y="80" width="370" height="410" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="600" y="108" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle">TEST 2 — ESP32-S3 + OLED 1,3"</text>
  <rect x="440" y="132" width="130" height="170" rx="6" fill="#172554" stroke="#60a5fa"/>
  <text x="505" y="155" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ESP32-S3</text>
  <text x="558" y="185" fill="#fdba74" font-size="11" text-anchor="end">3V3</text>
  <text x="558" y="215" fill="#cbd5e1" font-size="11" text-anchor="end">GND</text>
  <text x="558" y="245" fill="#7dd3fc" font-size="11" text-anchor="end">GPIO 41</text>
  <text x="558" y="275" fill="#7dd3fc" font-size="11" text-anchor="end">GPIO 42</text>

  <rect x="640" y="132" width="125" height="170" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="702" y="155" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">OLED 1,3"</text>
  <text x="650" y="185" fill="#fdba74" font-size="11">VCC</text>
  <text x="650" y="215" fill="#cbd5e1" font-size="11">GND</text>
  <text x="650" y="245" fill="#7dd3fc" font-size="11">SDA</text>
  <text x="650" y="275" fill="#7dd3fc" font-size="11">SCL</text>
  <text x="702" y="294" fill="#fbbf24" font-size="10" text-anchor="middle">Ordine pin varia!</text>

  <line x1="570" y1="181" x2="640" y2="181" stroke="#f97316" stroke-width="2.5"/>
  <line x1="570" y1="211" x2="640" y2="211" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="570" y1="241" x2="640" y2="241" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="570" y1="271" x2="640" y2="271" stroke="#38bdf8" stroke-width="2.5"/>

  <text x="435" y="330" fill="#86efac" font-size="12" font-weight="bold">Seriale 115200 baud:</text>
  <text x="435" y="352" fill="#e2e8f0" font-size="11">- PING -&gt; PONG | STATUS | DIAG</text>
  <text x="435" y="372" fill="#e2e8f0" font-size="11">- STATE:LOVE, STATE:CONFUSED ... (14)</text>
  <text x="435" y="392" fill="#e2e8f0" font-size="11">- LOOK:5,-3 (fuori range -&gt; ERR:LOOK_RANGE)</text>
  <text x="435" y="416" fill="#fbbf24" font-size="11">Shift 2px? Passa a env esp32s3_ssd1306</text>
  <text x="435" y="468" fill="#f87171" font-size="11" font-weight="bold">STOP se: corto 3V3-GND o OLED scalda</text>

  <!-- TEST 3 -->
  <rect x="810" y="80" width="365" height="410" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="992" y="108" fill="#facc15" font-size="15" font-weight="bold" text-anchor="middle">TEST 3 — Pulsante (GPIO 47)</text>
  <rect x="840" y="132" width="130" height="140" rx="6" fill="#172554" stroke="#60a5fa"/>
  <text x="905" y="155" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ESP32-S3</text>
  <text x="958" y="195" fill="#fde047" font-size="11" text-anchor="end">GPIO 47</text>
  <text x="958" y="235" fill="#cbd5e1" font-size="11" text-anchor="end">GND</text>

  <rect x="1030" y="150" width="115" height="105" rx="6" fill="#0f172a" stroke="#facc15"/>
  <text x="1087" y="175" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">Tasto NO</text>
  <text x="1042" y="198" fill="#fde047" font-size="11">Pin A</text>
  <text x="1042" y="238" fill="#cbd5e1" font-size="11">Pin B</text>

  <line x1="970" y1="192" x2="1030" y2="192" stroke="#facc15" stroke-width="2.5"/>
  <line x1="970" y1="232" x2="1030" y2="232" stroke="#94a3b8" stroke-width="2.5"/>

  <text x="830" y="310" fill="#86efac" font-size="12" font-weight="bold">Comportamento Atteso:</text>
  <text x="830" y="332" fill="#e2e8f0" font-size="11">- Pull-up interno attivo (Active LOW)</text>
  <text x="830" y="352" fill="#e2e8f0" font-size="11">- Pressione breve: modalità manuale</text>
  <text x="830" y="370" fill="#e2e8f0" font-size="11">  e ciclo tra le 14 espressioni</text>
  <text x="830" y="392" fill="#e2e8f0" font-size="11">- Pressione lunga (&gt;=1.5s): toggle</text>
  <text x="830" y="410" fill="#e2e8f0" font-size="11">  EVENT:AUTO_DEMO=ON / OFF</text>
  <text x="830" y="468" fill="#f87171" font-size="11" font-weight="bold">STOP se: pin collegato per errore a 5V o EN</text>
</svg>
