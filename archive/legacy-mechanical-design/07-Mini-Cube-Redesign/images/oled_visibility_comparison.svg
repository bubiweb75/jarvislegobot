<rect x="25" y="305" width="910" height="235" rx="8" fill="#eef1f4" stroke="#cbd2d9"/>
<text x="45" y="330" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="#111">Sol. 3 (Variante ampliata 33,0 × 18,4 mm, incasso 1,8 mm): Angolo H = ±44,8° (89,7° tot) | V = ±45,8° (91,6° tot)</text>
<text x="45" y="352" font-family="Segoe UI,Arial" font-size="11.5" fill="#333">• Rischio Sol. 3: riduce il sormonto sul vetro (34,5 mm) da 1,25 mm a soli 0,75 mm per lato (critico se la tolleranza PCB/vetro è ±0,5 mm).</text>
<text x="45" y="376" font-family="Segoe UI,Arial" font-size="12" font-weight="bold" fill="#1b5e20">Raccomandazione: Soluzione 2B (Inserto frontale 3D da 1,8 mm + Culla posteriore regolabile ±2,5 mm, finestra netta 32,0 × 19,2 mm)</text>
<text x="45" y="398" font-family="Segoe UI,Arial" font-size="11" fill="#333">  1. Quadruplica quasi l'angolo orizzontale utile (da ±9,2° a ±35,6° O, ±51,3° V) senza allargare visivamente la finestra 32,0 × 19,2 mm.</text>
<text x="45" y="418" font-family="Segoe UI,Arial" font-size="11" fill="#333">  2. Protegge il vetro (incasso 1,8 mm) mantenendo 1,25 mm/lato di copertura opaca sui bordi del pannello in vetro da 34,5 mm.</text>
<text x="45" y="438" font-family="Segoe UI,Arial" font-size="11" fill="#333">  3. Guadagna 6,2 mm di profondità interna dietro il frontale rispetto alla Sol. 1 (più spazio per connettore 4 pin, MAX98357A e cavi).</text>
<text x="45" y="458" font-family="Segoe UI,Arial" font-size="11" fill="#333">  4. Corpo LEGO invariato (80×80×96 mm): richiede solo l'apertura della tasca interna 6×8 plate (48×25,6 mm) al posto di 4×6 plate.</text>
<text x="45" y="486" font-family="Segoe UI,Arial" font-size="11" font-weight="bold" fill="#b71c1c">Note aperte prima del Passaggio B: (a) Discrepanza controller SH1106 vs SSD1106 da verificare; (b) Misure fisiche reali PCB/fori/offset ancora mancanti;</text>
<text x="45" y="504" font-family="Segoe UI,Arial" font-size="11" font-weight="bold" fill="#b71c1c">  (c) MPD definitivo e STL pronto per la stampa NON verranno prodotti finché non saranno confermate le quote fisiche.</text>
</svg>