<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" style="background:#f8f9fa">
<text x="490" y="28" font-family="Segoe UI,Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">FASE D — Scheda Pratica di Misurazione OLED Binghe 1,3" (Riferimenti Calibro)</text>

<!-- PANEL 1: VISTA FRONTALE QUOTATA (PCB 36x34 mm, Vetro, Area Attiva, Fori, Header) -->
<rect x="30" y="50" width="440" height="430" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<text x="250" y="75" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">1. Vista Frontale (lato vetro &amp; area attiva)</text>

<!-- PCB (scale 7x: 36x34 mm -> 252x238 px, origin at 124, 130) -->
<rect x="124" y="130" width="252" height="238" rx="4" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
<!-- 4 fori angolari -->
<circle cx="142" cy="148" r="7" fill="#ffffff" stroke="#ffb300" stroke-width="2"/>
<circle cx="358" cy="148" r="7" fill="#ffffff" stroke="#ffb300" stroke-width="2"/>
<circle cx="142" cy="350" r="7" fill="#ffffff" stroke="#ffb300" stroke-width="2"/>
<circle cx="358" cy="350" r="7" fill="#ffffff" stroke="#ffb300" stroke-width="2"/>
<text x="142" y="167" font-family="Segoe UI,Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">Ø L</text>

<!-- 4 pin header superiore -->
<rect x="208" y="136" width="84" height="16" rx="2" fill="#263238" stroke="#cfd8dc"/>
<circle cx="222" cy="144" r="3" fill="#ffd54f"/>
<circle cx="240" cy="144" r="3" fill="#ffd54f"/>
<circle cx="258" cy="144" r="3" fill="#ffd54f"/>
<circle cx="276" cy="144" r="3" fill="#ffd54f"/>
<text x="250" y="124" font-family="Segoe UI,Arial" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#111">GND | VCC | SCL | SDA (Header K)</text>

<!-- Vetro OLED (34.5x23 mm -> 241.5x161 px) -->
<rect x="129.2" y="168" width="241.5" height="161" fill="#212121" stroke="#ff9800" stroke-width="1.5"/>
<!-- Flex FPC inferiore -->
<rect x="205" y="329" width="90" height="32" fill="#d84315" fill-opacity="0.85" stroke="#bf360c"/>
<text x="250" y="348" font-family="Segoe UI,Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">Flex FPC (M)</text>

<!-- Area attiva (29.42x14.7 mm -> 205.9x102.9 px) -->
<rect x="147" y="186" width="205.9" height="102.9" fill="#050608" stroke="#4fc3f7" stroke-width="1.2" stroke-dasharray="4,2"/>
<rect x="180" y="212" width="46" height="50" rx="14" fill="#ffffff"/>
<rect x="274" y="212" width="46" height="50" rx="14" fill="#ffffff"/>
<text x="250" y="280" font-family="Segoe UI,Arial" font-size="9.5" text-anchor="middle" fill="#4fc3f7">Area attiva (E1 × E2)</text>

<!-- Linee di quota -->
<!-- A: Larghezza PCB -->
<line x1="124" y1="390" x2="376" y2="390" stroke="#111" stroke-width="1"/>
<text x="250" y="405" font-family="Segoe UI,Arial" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#111">A: Larghezza PCB (nom. 36,0 mm)</text>
<!-- B: Altezza PCB -->
<line x1="95" y1="130" x2="95" y2="368" stroke="#111" stroke-width="1"/>
<text x="88" y="250" font-family="Segoe UI,Arial" font-size="10.5" font-weight="bold" text-anchor="end" fill="#111">B</text>
<text x="88" y="263" font-family="Segoe UI,Arial" font-size="9" text-anchor="end" fill="#444">(34,0)</text>
<!-- C/D: Vetro -->
<text x="250" y="423" font-family="Segoe UI,Arial" font-size="10" text-anchor="middle" fill="#e65100">C × D: Vetro OLED (nom. 34,5 × 23,0 mm)</text>
<!-- F1, F2, G1, G2: Offset area attiva -->
<line x1="124" y1="238" x2="147" y2="238" stroke="#00acc1" stroke-width="1.5"/>
<text x="118" y="234" font-family="Segoe UI,Arial" font-size="9.5" font-weight="bold" text-anchor="end" fill="#00838f">F1</text>
<line x1="353" y1="238" x2="376" y2="238" stroke="#00acc1" stroke-width="1.5"/>
<text x="382" y="234" font-family="Segoe UI,Arial" font-size="9.5" font-weight="bold" fill="#00838f">F2</text>
<line x1="290" y1="130" x2="290" y2="186" stroke="#00acc1" stroke-width="1.5"/>
<text x="296" y="162" font-family="Segoe UI,Arial" font-size="9.5" font-weight="bold" fill="#00838f">G1</text>
<line x1="290" y1="289" x2="290" y2="368" stroke="#00acc1" stroke-width="1.5"/>
<text x="296" y="318" font-family="Segoe UI,Arial" font-size="9.5" font-weight="bold" fill="#00838f">G2</text>
<!-- H1, H2: Interasse fori -->
<line x1="142" y1="448" x2="358" y2="448" stroke="#f57f17" stroke-width="1.2"/>
<text x="250" y="463" font-family="Segoe UI,Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#e65100">H1 (interasse fori O) / H2 (interasse fori V)</text>

<!-- PANEL 2: VISTA LATERALE QUOTATA (Spessori & Connettore) -->
<rect x="490" y="50" width="460" height="230" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<text x="720" y="75" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">2. Vista Laterale (Spessori Z &amp; Ingombro Pin)</text>

<!-- Vetro + PCB + SMD + Pin -->
<rect x="640" y="125" width="12" height="105" fill="#ff9800" stroke="#e65100"/>
<rect x="652" y="100" width="14" height="150" fill="#1565c0" stroke="#0d47a1"/>
<!-- Componenti SMD dietro PCB -->
<rect x="666" y="165" width="14" height="40" fill="#546e7a"/>
<!-- Pin header superiore (dritto vs 90°) -->
<rect x="666" y="106" width="52" height="14" fill="#ffd54f" stroke="#f57f17"/>
<text x="724" y="116" font-family="Segoe UI,Arial" font-size="9.5" font-weight="bold" fill="#e65100">K1: Sporgenza pin/connettore post.</text>
<text x="724" y="130" font-family="Segoe UI,Arial" font-size="9" fill="#555">(o altezza K2 sopra bordo sup. PCB)</text>
<!-- Quote laterali -->
<text x="632" y="178" font-family="Segoe UI,Arial" font-size="9.5" font-weight="bold" text-anchor="end" fill="#e65100">J1: Spessore vetro</text>
<text x="632" y="191" font-family="Segoe UI,Arial" font-size="9" text-anchor="end" fill="#555">(nom. 1,4 mm)</text>
<text x="690" y="190" font-family="Segoe UI,Arial" font-size="9.5" font-weight="bold" fill="#0d47a1">J2: Spessore PCB + SMD (J3)</text>
<text x="720" y="266" font-family="Segoe UI,Arial" font-size="9.5" text-anchor="middle" fill="#333">Misurare da faccia anteriore vetro fino al punto più sporgente posteriore</text>

<!-- PANEL 3: TABELLA RIEPILOGO VERIFICHE FISICHE -->
<rect x="490" y="295" width="460" height="185" rx="8" fill="#eef1f4" stroke="#cbd2d9"/>
<text x="720" y="320" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">3. Punti Critici per Soluzione 2B (Incasso 1,8 mm)</text>
<text x="510" y="345" font-family="Segoe UI,Arial" font-size="10.5" fill="#111">• F1, F2, G1, G2 determinano se l'area attiva è centrata nella finestra 32×19,2 mm.</text>
<text x="510" y="366" font-family="Segoe UI,Arial" font-size="10.5" fill="#111">• J1 (vetro) + tolleranza stampa FDM (±0,2 mm) fissano lo scarico della cornice 3D.</text>
<text x="510" y="387" font-family="Segoe UI,Arial" font-size="10.5" fill="#111">• M (flex inferiore) impone la profondità dello scasso di protezione sulla culla.</text>
<text x="510" y="408" font-family="Segoe UI,Arial" font-size="10.5" fill="#111">• K1 / K2 confermano lo spazio libero davanti ad AS03604AR e sotto Plate 28.</text>
<text x="510" y="432" font-family="Segoe UI,Arial" font-size="10.5" font-weight="bold" fill="#b71c1c">• Verifica elettrica/firmware aperta: LDO 3,3V su VCC e controller SH1106 vs SSD1106.</text>

<!-- FOOTER -->
<rect x="30" y="495" width="920" height="105" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<text x="50" y="520" font-family="Segoe UI,Arial" font-size="12" font-weight="bold" fill="#111">Ricalcolo Angoli di Visibilità (Soluzione 2B — Incasso 1,8 mm, Finestra 32,0 × 19,2 mm):</text>
<text x="50" y="542" font-family="Segoe UI,Arial" font-size="11" fill="#333">• Limite geometrico nominale cornice: ±35,6° O (71,3° tot) | ±51,3° V (102,7° tot)</text>
<text x="50" y="562" font-family="Segoe UI,Arial" font-size="11" fill="#333">• Limite geometrico conservativo (con ±0,30 mm tolleranza stampa/centraggio): ±25,2° O (50,5° tot) | ±42,9° V (85,8° tot)</text>
<text x="50" y="582" font-family="Segoe UI,Arial" font-size="11" font-weight="bold" fill="#1b5e20">• Angolo ottico intrinseco del pannello OLED (&gt;160°): NON è il fattore limitante — il collo di bottiglia è solo geometrico.</text>
</svg>